name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint (includes security rules)
        run: ruff check netlanventory/ tests/
        continue-on-error: true

      - name: MyPy type check
        run: mypy netlanventory/ --ignore-missing-imports
        continue-on-error: true  # strict mode may have edge cases

  # ── Test Suite ─────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite
        run: |
          pytest tests/ \
            -v --tb=short -x \
            --ignore=tests/integration/test_dashboard_cache.py \
            --cov=netlanventory \
            --cov-report=term-missing \
            --cov-fail-under=30
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-prod"
          JWT_SECRET_KEY: "ci-test-jwt-secret-key"
          ADMIN_PASSWORD: "CiTest1234!@#$"
          APP_DEBUG: "true"

      - name: Run security regression tests
        run: pytest tests/test_security_regression.py -v --tb=short
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-prod"
          JWT_SECRET_KEY: "ci-test-jwt-secret-key"
          ADMIN_PASSWORD: "CiTest1234!@#$"
          APP_DEBUG: "true"

  # ── Dependency Security Audit ──────────────────────────────────
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: pip-audit
        run: pip-audit --strict
        continue-on-error: true

      - name: Bandit security scan
        run: bandit -r netlanventory/ -c pyproject.toml -q
        continue-on-error: true
