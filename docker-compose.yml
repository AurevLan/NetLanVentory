# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  nuclei_templates:   # Persists downloaded Nuclei templates across container restarts

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-netlanventory}
      POSTGRES_USER:     ${POSTGRES_USER:-netlv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netlv} -d ${POSTGRES_DB:-netlanventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: drop all capabilities not needed by PostgreSQL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql

  # ── Database migration (one-shot) ─────────────────────────────────────────
  migrate:
    build: .
    networks:
      - internal
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-netlv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-netlanventory}"
    command: >
      sh -c "
        until pg_isready -h db -U ${POSTGRES_USER:-netlv} -d ${POSTGRES_DB:-netlanventory} 2>/dev/null; do
          echo 'Waiting for postgres…'; sleep 2;
        done;
        alembic upgrade head
      "
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # ── Test runner (one-shot, profile: test) ─────────────────────────────────
  tests:
    build:
      context: .
      target: test      # dedicated stage with dev deps + tests/ copied in
    profiles: [test]
    environment:
      # Tests use SQLite in-memory — no PostgreSQL needed
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # ── OWASP ZAP web scanner daemon ──────────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=${ZAP_DISABLE_KEY:-true}
      -config api.key=${ZAP_API_KEY:-}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/JSON/core/view/version/ || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ── Application server ────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "${HOST_PORT:-8443}:8443"
    environment:
      DATABASE_URL:      "postgresql+asyncpg://${POSTGRES_USER:-netlv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-netlanventory}"
      APP_HOST:          ${APP_HOST:-0.0.0.0}
      APP_PORT:          8443
      APP_DEBUG:         ${APP_DEBUG:-false}
      LOG_LEVEL:         ${LOG_LEVEL:-INFO}
      SECRET_KEY:        ${SECRET_KEY:?SECRET_KEY must be set in .env}
      JWT_SECRET_KEY:    ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      ADMIN_EMAIL:       ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      ZAP_API_URL:       ${ZAP_API_URL:-http://zap:8080}
      ZAP_API_KEY:       ${ZAP_API_KEY:-}
      NVD_API_KEY:       ${NVD_API_KEY:-}
      NUCLEI_RATE_LIMIT: ${NUCLEI_RATE_LIMIT:-150}
      NUCLEI_TIMEOUT:    ${NUCLEI_TIMEOUT:-30}
      MAX_CONCURRENT_NUCLEI_SCANS: ${MAX_CONCURRENT_NUCLEI_SCANS:-2}
    # Security: drop all capabilities, then add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW       # Required for raw socket access (nmap SYN scans, ICMP)
      - NET_ADMIN     # Required for ARP scans
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zap:
        condition: service_healthy
    volumes:
      # Persist Nuclei templates (non-root user home)
      - nuclei_templates:/home/netlv/nuclei-templates
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8443/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Remediation worker (innovation #8) ────────────────────────────────────
  # Out-of-process executor for Ansible playbooks. Talks to the API only,
  # no DB access. Disabled by default — uncomment the profile or remove it
  # to enable.
  remediation-worker:
    profiles: ["remediation"]
    build:
      context: .
      dockerfile: remediation_worker/Dockerfile
    restart: unless-stopped
    networks:
      - internal
    environment:
      NLV_API_URL:           "http://app:8443/api/v1"
      NLV_API_TOKEN:         ${REMEDIATION_WORKER_TOKEN:-}
      POLL_INTERVAL_SECONDS: ${REMEDIATION_POLL_SECONDS:-10}
      ANSIBLE_TIMEOUT_SECONDS: ${REMEDIATION_ANSIBLE_TIMEOUT:-1800}
      SSH_KEY_PATH:          /run/secrets/ssh_private_key
    secrets:
      - ssh_private_key
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      app:
        condition: service_healthy

secrets:
  ssh_private_key:
    file: ${REMEDIATION_SSH_KEY_FILE:-./remediation_worker/.gitkeep}
