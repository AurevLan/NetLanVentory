[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netlanventory"
version = "0.12.0"
description = "Modular network scanning and inventory tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NetLanVentory Contributors" }]

dependencies = [
    # Web framework
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    # Configuration
    "pydantic-settings>=2.13.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    # CLI
    "click>=8.3.2",
    "rich>=14.0.0",
    # Networking / scanning
    "python-nmap>=0.7.1",
    # Authentication
    "pyjwt>=2.12.0",
    "bcrypt>=4.3.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    # Logging
    "structlog>=25.1.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Async utilities
    "anyio>=4.9.0",
    "httpx>=0.28.0",
    # SSH connectivity (SSH CVE scan)
    "asyncssh>=2.21.0",
    # Symmetric encryption (SSH credential storage)
    "cryptography>=46.0.0",
    # YAML generation (Ansible playbooks)
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.5.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.21.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    # "pytest-postgresql>=6.1.0",  # removed: tests use SQLite, not psycopg
    "respx>=0.22.0",
    "bandit>=1.9.0",
    "safety>=3.3.0",
    "pip-audit>=2.9.0",
]
cache = ["redis>=5.2.0"]
email = ["aiosmtplib>=3.0.2"]
ldap = ["ldap3>=2.9.1"]
cloud = ["boto3>=1.37.0", "azure-mgmt-compute>=34.0.0"]
reports = ["weasyprint>=63.0", "openpyxl>=3.1.5"]
full = [
    "redis>=5.2.0",
    "aiosmtplib>=3.0.2",
    "ldap3>=2.9.1",
    "weasyprint>=63.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
netlv = "netlanventory.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["netlanventory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "S101",  # assert used (ok in tests)
    "S603",  # subprocess call (needed for scanners)
    "S607",  # partial path (scanner binaries)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B603", "B607"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "security: Security regression tests",
    "smoke: Quick smoke tests for endpoint wiring",
    "crud: CRUD operation tests",
    "admin: Admin-only endpoint tests",
    "unit: Pure unit tests (no DB/HTTP)",
    "integration: Integration tests (may require external services)",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
